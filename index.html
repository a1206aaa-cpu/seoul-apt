<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 아파트 실거래 범위</title>
<meta name="description" content="서울 500세대 이상 아파트의 최근 실거래가 범위(최저~최고)와 최근 거래가를 한눈에 비교">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1f; --sub:#6b6b70; --line:#e4e4e0; --bar:#2f6fde; --dot:#e8590c; --up:#d64545; --down:#2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e21; --text:#ececef; --sub:#9a9aa2; --line:#2e2e33; --bar:#5b8cf0; --dot:#ff8a3d; --up:#ff6b6b; --down:#6e9bff; }
  }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; max-width:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0 0 2px; }
  .meta { color:var(--sub); font-size:12px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  select, input { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  .filters select { flex:1 1 30%; min-width:0; }
  input { flex:1 1 140px; min-width:0; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:11px; color:var(--sub); margin-top:6px; }
  .legend i { display:inline-block; width:14px; height:8px; border-radius:4px; background:var(--bar); vertical-align:middle; margin-right:4px; }
  .legend b { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--dot); vertical-align:middle; margin-right:4px; }
  .legend u { display:inline-block; width:0; height:10px; border-left:2px dashed var(--dot); vertical-align:middle; margin-right:4px; opacity:.6; }
  .axis { position:relative; height:18px; margin:8px 16px 0; font-size:11px; color:var(--sub); }
  .axis span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  main { padding:8px 16px 24px; max-width:860px; margin:0 auto; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  .row.home { border:2px solid var(--dot); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto; }
  .price { white-space:nowrap; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .pin { flex:0 0 auto; border:0; background:none; color:var(--sub); font-size:15px; padding:0 2px; cursor:pointer; line-height:1; }
  .row.home .pin { color:var(--dot); }
  .sub { color:var(--sub); font-size:12px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 8px; }
  .sub span:last-child { white-space:nowrap; }
  .track { position:relative; height:12px; margin-top:6px; background:linear-gradient(to right, var(--line) 1px, transparent 1px) 0 0/10% 100%; border-radius:3px; }
  .bar { position:absolute; top:2px; height:8px; background:var(--bar); border-radius:4px; min-width:4px; opacity:.85; }
  .dot { position:absolute; top:0; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:var(--dot); border:2px solid var(--card); }
  .ref { position:absolute; top:-3px; bottom:-3px; width:0; border-left:2px dashed var(--dot); opacity:.45; }
  .badge { display:inline-block; font-size:11px; font-weight:600; color:#fff; background:var(--dot); border-radius:6px; padding:1px 6px; margin-right:6px; vertical-align:1px; }
  .diff { font-size:11px; margin-left:4px; }
  .more { display:block; width:100%; padding:10px; margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  .msg { color:var(--sub); padding:40px 0; text-align:center; }
  .hint { color:var(--sub); font-size:12px; padding:4px 2px 8px; }
  footer { color:var(--sub); font-size:11px; text-align:center; padding:8px 16px 32px; line-height:1.6; }
  footer a { color:inherit; }
  @media (max-width: 420px) {
    header { padding:10px 12px 6px; }
    main { padding:8px 12px 24px; }
    .row { padding:8px; }
    .price { font-size:13px; }
  }
</style>
</head>
<body>
<header>
  <h1>서울 500세대+ 아파트 실거래가 범위</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <div class="filters">
    <select id="area" aria-label="전용면적">
      <option value="84" selected>전용 84㎡대</option>
      <option value="59">전용 59㎡대</option>
      <option value="74">전용 74㎡대</option>
      <option value="small">50㎡ 미만</option>
      <option value="large">90㎡ 초과</option>
      <option value="all">전체 평형</option>
    </select>
    <select id="period" aria-label="기간">
      <option value="3">최근 3개월</option>
      <option value="6">최근 6개월</option>
      <option value="12" selected>최근 12개월</option>
    </select>
    <select id="gu" aria-label="구"><option value="">서울 전체</option></select>
    <select id="sort" aria-label="정렬">
      <option value="lastAsc" selected>가격 낮은순</option>
      <option value="last">최근거래가 높은순</option>
      <option value="max">최고가순</option>
      <option value="min">최저가순</option>
      <option value="near">내 단지와 비슷한 가격순</option>
      <option value="count">거래 많은순</option>
      <option value="hh">세대수순</option>
    </select>
    <input id="q" placeholder="단지명 검색" aria-label="단지명 검색">
  </div>
  <div class="legend"><span><i></i>최저~최고</span><span><b></b>최근 거래</span><span id="lgHome" hidden><u></u>내 단지 최근가</span></div>
  <div class="axis" id="axis"></div>
</header>
<main id="list"><div class="msg">데이터를 불러오는 중…</div></main>
<footer>
  자료: 국토교통부 실거래가 공개시스템·공공데이터포털, 공동주택관리정보시스템(K-apt).<br>
  계약일 기준 매매 실거래(해제 거래 제외), 500세대 이상 분양 단지만 표시합니다. 참고용이며 법적 효력이 없습니다.<br>
  ☆를 누르면 그 단지가 맨 위에 고정돼요(이 기기에만 저장).
</footer>

<script>
  var DATA_URL = 'https://script.google.com/macros/s/AKfycbw1RKBE4bVOZeCfnTSqjx01pbYnEKRrAtVf41u0JBJOdpxm2F6ayUPEflRzBqG_EFDt/exec?format=json';
  var CACHE_KEY = 'aptData.v1', HOME_KEY = 'aptHome.v1';
  var RAW = [], SHOWN = 100, UPD = '';
  var $ = function (id) { return document.getElementById(id); };

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // 내 단지: 주소의 ?home=단지코드 가 우선, 없으면 이 기기에 저장된 값
  var HOME = (new URLSearchParams(location.search)).get('home') || load(HOME_KEY) || '';

  function eok(v) { // 만원 → 억
    var e = v / 10000;
    return (e >= 10 ? e.toFixed(1) : e.toFixed(2)).replace(/\.?0+$/, '') + '억';
  }
  function inArea(a, key) {
    if (key === 'all') return true;
    if (key === 'small') return a < 50;
    if (key === '59') return a >= 50 && a < 65;
    if (key === '74') return a >= 65 && a < 80;
    if (key === '84') return a >= 80 && a <= 90;
    if (key === 'large') return a > 90;
    return true;
  }
  function cutoff(months) {
    var d = new Date(); d.setMonth(d.getMonth() - Number(months));
    return d.toISOString().slice(0, 10);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function aggregate(onlyCode) {
    var area = $('area').value, gu = $('gu').value, q = $('q').value.trim();
    var from = cutoff($('period').value), map = {};
    RAW.forEach(function (r) {
      // r = [단지코드, 단지명, 구, 세대수, 전용면적, 금액(만원), 계약일]
      if (r[6] < from || !inArea(r[4], area)) return;
      if (onlyCode) { if (r[0] !== onlyCode) return; }
      else {
        if (gu && r[2] !== gu) return;
        if (q && r[1].indexOf(q) < 0) return;
      }
      var g = map[r[0]];
      if (!g) g = map[r[0]] = { code: r[0], name: r[1], gu: r[2], hh: r[3], min: r[5], max: r[5], last: r[5], lastDate: r[6], count: 0 };
      g.count++;
      if (r[5] < g.min) g.min = r[5];
      if (r[5] > g.max) g.max = r[5];
      if (r[6] > g.lastDate || (r[6] === g.lastDate && r[5] > g.last)) { g.last = r[5]; g.lastDate = r[6]; }
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function sortList(arr, home) {
    var s = $('sort').value;
    if (s === 'near' && !home) s = 'lastAsc';
    arr.sort(function (a, b) {
      if (s === 'lastAsc') return (a.last - b.last) || (a.min - b.min);
      if (s === 'min') return a.min - b.min;
      if (s === 'near') return Math.abs(a.last - home.last) - Math.abs(b.last - home.last);
      return (b[s] - a[s]) || (b.max - a.max);
    });
    return arr;
  }

  function niceStep(span) {
    var raw = span / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
  }

  function render() {
    var home = HOME ? (aggregate(HOME)[0] || null) : null;
    var arr = sortList(aggregate().filter(function (g) { return g.code !== HOME; }), home);
    var list = $('list');
    $('lgHome').hidden = !home;
    if (!arr.length && !home) { list.innerHTML = '<div class="msg">조건에 맞는 거래가 없어요</div>'; $('axis').innerHTML = ''; setMeta(0, home); return; }
    var lo = Infinity, hi = -Infinity;
    arr.concat(home ? [home] : []).forEach(function (g) { if (g.min < lo) lo = g.min; if (g.max > hi) hi = g.max; });
    var step = niceStep(Math.max(hi - lo, 10000));
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    var pct = function (v) { return ((v - lo) / (hi - lo) * 100).toFixed(2); };

    var ax = '';
    for (var t = lo; t <= hi + 1; t += step) ax += '<span style="left:' + pct(t) + '%">' + eok(t) + '</span>';
    $('axis').innerHTML = ax;

    var ref = home ? '<div class="ref" style="left:' + pct(home.last) + '%"></div>' : '';
    var rowHtml = function (g, isHome) {
      var diff = '';
      if (home && !isHome) {
        var d = g.last - home.last;
        diff = '<span class="diff" style="color:var(' + (d > 0 ? '--up' : '--down') + ')">(' + (d > 0 ? '+' : '−') + eok(Math.abs(d)) + ')</span>';
      }
      return '<div class="row' + (isHome ? ' home' : '') + '">' +
        '<div class="top"><div class="name">' + (isHome ? '<span class="badge">내 단지</span>' : '') + esc(g.name) + '</div>' +
        '<div class="price">' + eok(g.min) + ' ~ ' + eok(g.max) + '</div>' +
        '<button class="pin" data-code="' + esc(g.code) + '" aria-label="' + (isHome ? '고정 해제' : '맨 위에 고정') + '">' + (isHome ? '★' : '☆') + '</button></div>' +
        '<div class="sub"><span>' + esc(g.gu) + ' · ' + Number(g.hh).toLocaleString() + '세대 · ' + g.count + '건</span>' +
        '<span>최근 ' + eok(g.last) + diff + ' (' + g.lastDate.slice(2).replace(/-/g, '.') + ')</span></div>' +
        '<div class="track">' + (isHome ? '' : ref) + '<div class="bar" style="left:' + pct(g.min) + '%;width:' + (pct(g.max) - pct(g.min)) + '%"></div>' +
        '<div class="dot" style="left:' + pct(g.last) + '%"></div></div></div>';
    };
    var html = '';
    if (home) html += rowHtml(home, true);
    else if (HOME) html += '<div class="hint">고정한 단지는 이 조건(평형·기간)에 거래가 없어요.</div>';
    html += arr.slice(0, SHOWN).map(function (g) { return rowHtml(g, false); }).join('');
    if (arr.length > SHOWN) html += '<button class="more" id="more">더 보기 (' + (arr.length - SHOWN) + '개 남음)</button>';
    list.innerHTML = html;
    setMeta(arr.length + (home ? 1 : 0), home);
  }

  function setMeta(n, home) {
    $('meta').textContent = n + '개 단지' + (UPD ? ' · 갱신 ' + new Date(UPD).toLocaleDateString('ko-KR') : '') + (home ? '' : ' · ☆로 내 단지 고정');
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.pin');
    if (b) {
      var code = b.getAttribute('data-code');
      HOME = (HOME === code) ? '' : code;
      store(HOME_KEY, HOME || null);
      SHOWN = 100; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (e.target.id === 'more') { SHOWN += 100; render(); }
  });
  ['area', 'period', 'gu', 'sort'].forEach(function (id) { $(id).addEventListener('change', function () { SHOWN = 100; render(); }); });
  $('q').addEventListener('input', function () { SHOWN = 100; render(); });

  function apply(D) {
    RAW = D.t.map(function (x) { var c = D.c[x[0]]; return [c[0], c[1], c[2], c[3], x[1], x[2], x[3]]; });
    UPD = D.u || '';
    var sel = $('gu'), cur = sel.value, gus = {};
    RAW.forEach(function (r) { gus[r[2]] = 1; });
    sel.innerHTML = '<option value="">서울 전체</option>' + Object.keys(gus).sort().map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('');
    sel.value = cur;
    render();
  }

  // 1) 이 기기에 저장된 데이터로 바로 그리기  2) 최신 데이터 받아서 갱신
  var cached = load(CACHE_KEY);
  if (cached) { try { apply(JSON.parse(cached)); } catch (e) { store(CACHE_KEY, null); cached = null; } }
  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (txt) {
      var D = JSON.parse(txt);
      if (!D || !D.t || !D.t.length) throw new Error('빈 데이터');
      store(CACHE_KEY, txt);
      apply(D);
    })
    .catch(function (err) {
      if (!cached) $('list').innerHTML = '<div class="msg">데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.<br><small>' + esc(err.message) + '</small></div>';
    });
</script>
</body>
</html>
